name: Build exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild StomatoloskaOrdinacijaKartoteka\StomatoloskaOrdinacijaKartoteka.csproj /p:Configuration=Release /p:Platform=AnyCPU /restore:false

      # Samo exe, bez DataBase.accdb da se ne pregazi baza kod klijenta
      - name: Zip exe
        run: Compress-Archive -Path StomatoloskaOrdinacijaKartoteka\bin\Release\StomatoloskaOrdinacijaKartoteka.exe -DestinationPath StomatoloskaOrdinacijaKartoteka-exe.zip

      - name: Build MSI
        run: |
          dotnet tool install --global wix --version 5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build Installer\Product.wxs -d BinDir="$PWD\StomatoloskaOrdinacijaKartoteka\bin\Release" -d Build=${{ github.run_number }} -o StomatoloskaOrdinacijaKartoteka.msi

      - uses: actions/upload-artifact@v4
        with:
          name: StomatoloskaOrdinacijaKartoteka-exe
          path: StomatoloskaOrdinacijaKartoteka\bin\Release\StomatoloskaOrdinacijaKartoteka.exe

      # Release se lakše skida sa telefona nego artifact
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            StomatoloskaOrdinacijaKartoteka.msi
            StomatoloskaOrdinacijaKartoteka-exe.zip
